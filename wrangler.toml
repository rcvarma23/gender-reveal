name = "gender-reveal-byrc"
main = "workers/index.js"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# ── STATIC ASSETS ────────────────────────────────────────────────
# Served automatically for matching files; falls through to the Worker
# (workers/index.js) for everything else, i.e. all /api/* routes.
[assets]
directory = "./public"

# ── KV NAMESPACES ──────────────────────────────────────────────
[[kv_namespaces]]
binding = "GR_KV"
id      = "fc681d36b51d486dbbf71511c1251407"
preview_id = "e2ff626adafb4495945c394f28ac9846"

# ── R2 BUCKET (video storage) ───────────────────────────────────
[[r2_buckets]]
binding = "GR_R2"
bucket_name = "gender-reveal-video"  # create via: wrangler r2 bucket create gender-reveal-video

# ── ENVIRONMENT VARIABLES ──────────────────────────────────────
# DO NOT put secrets here — use: wrangler secret put ADMIN_PIN_HASH
[vars]
ENVIRONMENT      = "production"
PARTY_NAME       = "Baby Reveal Party"
PARTY_LOCATION   = "Atlanta, GA"
TOTAL_VOUCHERS   = "10"
LETTERS_NEEDED   = "7"

# NOTE: routing across the six API modules happens inside
# workers/index.js (a single Worker script), not via [[routes]] —
# that field routes a whole zone to different Worker *services*,
# it can't point sub-paths of one project at separate script files.

# ── DEPLOY COMMAND ──────────────────────────────────────────────
# npx wrangler deploy
# npx wrangler dev   ← local development with live KV

# ── SECRETS TO SET BEFORE PARTY ────────────────────────────────
# npx wrangler secret put ADMIN_PIN_HASH
# npx wrangler secret put COUPLE_PIN_HASH
# npx wrangler secret put SECRET_CODE          ← the 10-letter voucher/scratch-card phrase
# npx wrangler secret put COUPLE_STAGE1_WORD   ← Stage 1 (Word Scramble) phrase
# npx wrangler secret put COUPLE_STAGE2_WORD   ← Stage 2 (Memory Match) phrase
# npx wrangler secret put COUPLE_STAGE3_WORD   ← Stage 3 (Puzzle Assembly) phrase
# npx wrangler secret put PARTY_GENDER          ← "girl" or "boy" — the actual result,
#                                                  pre-set so tv-mode.html's auto-reveal
#                                                  timer needs no live confirmation

# ── DEV ENVIRONMENT ──────────────────────────────────────────────
# Separate Worker name, KV namespace, R2 bucket, and secrets from prod.
# Deploy with: wrangler deploy --env dev
# Set up once:
#   wrangler kv:namespace create "GR_KV" --env dev
#   wrangler r2 bucket create gender-reveal-video-dev
#   wrangler secret put ADMIN_PIN_HASH --env dev
#   wrangler secret put COUPLE_PIN_HASH --env dev
#   wrangler secret put SECRET_CODE --env dev
#   wrangler secret put COUPLE_STAGE1_WORD --env dev
#   wrangler secret put COUPLE_STAGE2_WORD --env dev
#   wrangler secret put COUPLE_STAGE3_WORD --env dev
#   wrangler secret put PARTY_GENDER --env dev
[env.dev]
name = "gender-reveal-dev-byrc"

[[env.dev.kv_namespaces]]
binding = "GR_KV"
id      = "65d2193d0025458da259eef22b06549a"

[[env.dev.r2_buckets]]
binding = "GR_R2"
bucket_name = "gender-reveal-video-dev"  # create via: wrangler r2 bucket create gender-reveal-video-dev

[env.dev.vars]
ENVIRONMENT      = "dev"
PARTY_NAME       = "Baby Reveal Party (TEST)"
PARTY_LOCATION   = "Atlanta, GA"
TOTAL_VOUCHERS   = "10"
LETTERS_NEEDED   = "7"
