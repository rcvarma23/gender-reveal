<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0D0B1E">
  <title>Your Secret Letter 🎀</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">

  <style>
    body { background: var(--navy-deepest); overflow-x: hidden; }
    .page-inner {
      position: relative; z-index: 2; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 1.5rem 1.25rem 3rem; gap: 1.5rem; text-align: center;
    }
    .letter-box {
      width: 100%; max-width: 260px; aspect-ratio: 1;
      border-radius: var(--radius-xl); display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--navy-mid), var(--navy-card));
      box-shadow: var(--shadow-float), 0 0 40px rgba(201,168,76,0.25);
      animation: cardDrop .6s cubic-bezier(0.34,1.56,0.64,1) both, glowReveal 1.2s ease both;
    }
    .letter-box-text {
      font-family: var(--font-display); font-size: clamp(5rem, 28vw, 8rem); font-weight: 900;
      background: linear-gradient(135deg, var(--gold-dim), var(--gold-bright), var(--gold-shimmer));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      filter: drop-shadow(0 0 20px rgba(201,168,76,0.5));
    }
    .headline { font-family: var(--font-display); font-size: 1.3rem; color: var(--gold-soft); max-width: 320px; }
    .subline  { font-size: .85rem; color: var(--text-muted); max-width: 300px; }
  </style>
</head>
<body>
  <main class="page-inner">
    <div class="headline">You found a piece of the secret! 🎀</div>

    <div class="letter-box">
      <span class="letter-box-text" id="letterChar">?</span>
    </div>

    <div class="subline">Show this letter to the parents-to-be — every guest's letter combines into the final code.</div>

    <button class="btn btn-secondary" id="backBtn">Back to Party</button>
  </main>

  <script type="module">
    import SessionManager from '../js/core/session.js';
    import API            from '../js/core/api.js';
    import PartyState      from '../js/core/state.js';
    import Confetti        from '../js/systems/confetti.js';

    const letterChar = document.getElementById('letterChar');
    const session = SessionManager.getCurrentSession();

    PartyState.startPolling((state) => {
      if (state === 'waiting') window.location.href = 'index.html';
    });

    const showLetter = (letter) => {
      letterChar.textContent = letter;
      Confetti.burst({ palette: 'gold' });
    };

    const init = async () => {
      if (session?.letterRevealed && session.letter) {
        showLetter(session.letter);
        return;
      }

      if (session?.voucherCode) {
        const result = await API.voucher.status(session.voucherCode);
        if (result.success && result.exists && result.status === 'revealed') {
          SessionManager.updateSession({ letter: result.letter, letterRevealed: true });
          showLetter(result.letter);
          return;
        }
      }

      // No revealed letter to show for this device — nothing to recover
      window.location.href = 'play.html';
    };

    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = 'play.html';
    });

    init();
  </script>
</body>
</html>
