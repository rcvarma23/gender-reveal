<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0D0B1E">
  <title>The Big Guess 🎯</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">

  <style>
    body { background: var(--navy-deepest); overflow-x: hidden; }
    .page-inner { position: relative; z-index: 2; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: 1.5rem 1.25rem 3rem; }
    .header-row { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 420px; margin-bottom: 1.5rem; }
    .back-btn {
      display: flex; align-items: center; gap: .4rem;
      background: transparent; border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full); padding: .45rem 1rem;
      color: var(--text-muted); font-size: .8rem; cursor: pointer;
      transition: all var(--transition-base); font-family: var(--font-body);
    }
    .back-btn:hover { border-color: var(--border-gold); color: var(--gold-soft); }
    #guessStage {
      width: 100%; max-width: 420px; min-height: 60vh;
      background: var(--navy-surface); border-radius: var(--radius-lg);
      border: 1.5px solid var(--border-subtle); position: relative; overflow: hidden;
      display: flex; flex-direction: column; padding: 1.25rem; box-sizing: border-box; gap: 1rem;
    }
  </style>
</head>
<body>
  <main class="page-inner">
    <div class="header-row">
      <button class="back-btn" onclick="window.location.href='play.html'">← Back</button>
      <span class="badge badge-gold">🎯 The Big Guess</span>
    </div>

    <div id="guessStage">
      <div style="display:flex;justify-content:space-between;font-size:.8rem;color:var(--text-muted);">
        <span id="guessProgress"></span><span id="guessTimer"></span>
      </div>
      <div id="guessQuestion" style="font-size:1.1rem;font-weight:600;color:var(--text-primary);min-height:3.5rem;"></div>
      <div id="guessChoices" style="display:flex;flex-direction:column;gap:.65rem;overflow-y:auto;"></div>
      <div id="guessFooter" style="text-align:center;color:var(--text-muted);font-size:.8rem;"></div>
      <button class="btn btn-secondary" id="guessHomeBtn" style="display:none">🏠 Home</button>
    </div>
  </main>

  <script type="module">
    import API        from '../js/core/api.js';
    import PartyState  from '../js/core/state.js';

    const TICK_MS = 2000;
    const HOME_REDIRECT_DELAY_MS = 8000;
    let lastVotedIndex = -1;
    let homeRedirectScheduled = false;

    const homeBtn = document.getElementById('guessHomeBtn');
    homeBtn.addEventListener('click', () => { window.location.href = 'play.html'; });

    PartyState.startPolling((state) => {
      if (state === 'waiting')  window.location.href = 'index.html';
      if (state === 'revealed') window.location.href = 'reveal.html';
    });

    const guessTick = async () => {
      const res = await API.poll.state();
      if (!res.success) return;

      const progEl    = document.getElementById('guessProgress');
      const timerEl   = document.getElementById('guessTimer');
      const qEl       = document.getElementById('guessQuestion');
      const choicesEl = document.getElementById('guessChoices');
      const footerEl  = document.getElementById('guessFooter');

      // Admin LOCKed the party for the couple's finale and hasn't
      // individually re-opened Big Guess — block regardless of the
      // underlying poll status.
      if (res.finaleLocked) {
        progEl.textContent = 'The Big Guess';
        timerEl.textContent = '';
        qEl.textContent = '🔒 Paused — check back after the couple\'s finale!';
        choicesEl.innerHTML = '';
        footerEl.textContent = '';
        homeBtn.style.display = 'none';
        return;
      }

      if (res.status === 'disabled') {
        progEl.textContent = 'The Big Guess';
        timerEl.textContent = '';
        qEl.textContent = '🎯 The host hasn\'t opened this yet — check back soon!';
        choicesEl.innerHTML = '';
        footerEl.textContent = '';
        homeBtn.style.display = 'none';
        return;
      }

      if (res.status === 'ready') {
        progEl.textContent = 'The Big Guess';
        timerEl.textContent = '';
        qEl.textContent = '🎯 Waiting for the host to start...';
        choicesEl.innerHTML = '';
        footerEl.textContent = '';
        homeBtn.style.display = 'none';
        lastVotedIndex = -1;
        return;
      }

      if (res.status === 'complete') {
        progEl.textContent = 'The Big Guess — Finished';
        timerEl.textContent = '';
        qEl.textContent = '🎉 Thanks for guessing!';
        choicesEl.innerHTML = '';
        footerEl.textContent = '📺 Check the TV for the full results! Heading home shortly...';
        homeBtn.style.display = 'inline-flex';
        if (!homeRedirectScheduled) {
          homeRedirectScheduled = true;
          setTimeout(() => { window.location.href = 'play.html'; }, HOME_REDIRECT_DELAY_MS);
        }
        return;
      }

      // status === 'active'
      homeBtn.style.display = 'none';
      progEl.textContent = `Question ${res.currentIndex + 1} / ${res.totalQuestions}`;
      timerEl.textContent = `⏱ ${Math.max(0, res.secLeft)}s`;
      qEl.textContent = res.question;

      if (res.phase === 'voting') {
        if (lastVotedIndex !== res.currentIndex) {
          choicesEl.innerHTML = '';
          res.choices.forEach((text, i) => {
            const btn = document.createElement('button');
            btn.textContent = text;
            btn.style.cssText = 'padding:.85rem 1rem;border-radius:var(--radius-md,12px);border:1.5px solid rgba(255,255,255,.15);background:var(--navy-mid,#2a2660);color:var(--text-primary);font-size:.95rem;text-align:left;cursor:pointer;';
            btn.addEventListener('click', async () => {
              if (lastVotedIndex === res.currentIndex) return;
              lastVotedIndex = res.currentIndex;
              [...choicesEl.children].forEach(b => { b.disabled = true; });
              btn.style.borderColor = 'var(--gold-bright,#FFD700)';
              await API.poll.vote(res.currentIndex, i);
              footerEl.textContent = 'Guess submitted — waiting for results...';
            });
            choicesEl.appendChild(btn);
          });
          footerEl.textContent = '';
        }
      } else {
        // Results phase — tallies are shown on the TV only (poll-host.html),
        // not to guest phones.
        choicesEl.innerHTML = '';
        footerEl.textContent = '📺 Results are on the TV — next question coming up...';
      }
    };

    guessTick();
    setInterval(guessTick, TICK_MS);
  </script>
</body>
</html>
